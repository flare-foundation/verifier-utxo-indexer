x-django: &django
  user: "root"
  build:
    context: ../
    dockerfile: Dockerfile
    args:
      DEV: "true"
  env_file:
    - ../.env

services:
  postgresdb:
    container_name: ${COMPOSE_PROJECT_NAME}_db
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: postgres -c max_wal_size=2GB
    ports:
      - "127.0.0.1:${DB_PROXY_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # uncomment to persist db data between downs
    # volumes:
    #  - ./db-data/:/var/lib/postgresql/data
    # uncomment for query logging
    # command: ["postgres", "-c", "log_statement=all", "-c", "log_destination=stderr"]

  appserver:
    <<: *django
    container_name: ${COMPOSE_PROJECT_NAME}_server
    entrypoint: ["/app/docker/entrypoint-local.sh"]
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "127.0.0.1:${SERVER_PROXY_PORT}:8000"
    depends_on:
      postgresdb:
        condition: service_healthy
    volumes:
      - ../:/app
      - ../media/:/appdata/media
