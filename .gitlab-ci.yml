variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

.test_template:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv
  before_script:
    - uv sync --frozen
  rules:
    - if: $CI_COMMIT_BRANCH

stages:
  - build
  - test
  - deploy

build_branches:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "$CI_COMMIT_SHA" > COMMIT_HASH
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG --cache=true --cache-ttl=120h
  only:
    - branches

build_tags:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "$CI_COMMIT_SHA" > COMMIT_HASH
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG --cache=true --cache-ttl=120h
  only:
    - tags

test_django:
  extends: .test_template
  variables:
    POSTGRES_DB: "db"
    DB_NAME: "db"
    POSTGRES_USER: "dbuser"
    DB_USER: "dbuser"
    POSTGRES_PASSWORD: "dbpass"
    DB_PASSWORD: "dbpass"
    DB_HOST: "postgresdb"
    DB_PORT: "5432"
    NODE_RPC_URL: "https://provide_me"
    AUTH_USERNAME: authuser
    AUTH_PASSWORD: authpass
  services:
    - name: postgres:18
      alias: postgresdb
  script:
    - uv run pytest --cov --cov-report=xml:coverage.xml --junit-xml=junit.xml .
  artifacts:
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test_ruff:
  extends: .test_template
  script:
    - uv run ruff check .
    - uv run ruff format --check
